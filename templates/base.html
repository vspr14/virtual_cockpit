<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Virtual Cockpit{% endblock %}</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    {% include 'widgets/pwa_head.html' %}
    <script>
        /* iPad: render at 90% so a full cockpit fits an 11" screen in landscape. */
        (function () {
            var ua = navigator.userAgent || '';
            var isIPad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (!isIPad) return;
            var m = document.querySelector('meta[name="viewport"]');
            if (m) m.setAttribute('content', 'width=device-width, initial-scale=0.9, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}
</head>

<body {% block body_attrs %}{% endblock %}>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/core/pwa_boot.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
