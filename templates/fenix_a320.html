<!DOCTYPE html>
<html>
<head>
    <title>MSFS Glass Cockpit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="screen-layout">
        <div class="left-column">
            <div class="tod-panel">
                <div id="utcClock" class="utc-clock">--:--Z</div>
                <div class="tod-input-row">
                    <input id="todHour" class="tod-input" type="number" min="0" max="23" placeholder="HH">
                    <span class="tod-separator">:</span>
                    <input id="todMinute" class="tod-input" type="number" min="0" max="59" placeholder="MM">
                    <button id="todSetBtn" class="tod-btn">SET TD</button>
                </div>
                <div id="todStatus" class="tod-status"></div>
            </div>

            <div id="leftBrakeContainer" class="left-brake-container hidden">
                <div class="v-group">
                    <span class="label">BRAKE</span>
                    <div class="center-v-wrap">
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="bSliderLeft">
                    </div>
                    <button id="pbBtnLeft" class="sub-btn red-btn">PARKING BRAKE</button>
                </div>
            </div>

            <div class="ovhd-section lights-panel">
                <div class="ovhd-section-label">EXT LT</div>
                <div class="lights-grid">
                    <div class="flip-sw" id="swBeacon" role="button" tabindex="0">
                        <span class="flip-pos-lbl">ON</span>
                        <div class="flip-track"><div class="flip-lever"></div></div>
                        <span class="flip-pos-lbl">OFF</span>
                        <span class="flip-name">BEACON</span>
                    </div>
                    <div class="flip-sw" id="swNavLogo" role="button" tabindex="0">
                        <span class="flip-pos-lbl">ON</span>
                        <div class="flip-track"><div class="flip-lever"></div></div>
                        <span class="flip-pos-lbl">OFF</span>
                        <span class="flip-name">NAV LOGO</span>
                    </div>
                    <div class="flip-sw" id="swWingScan" role="button" tabindex="0">
                        <span class="flip-pos-lbl">ON</span>
                        <div class="flip-track"><div class="flip-lever"></div></div>
                        <span class="flip-pos-lbl">OFF</span>
                        <span class="flip-name">WING</span>
                    </div>
                    <div class="flip-sw" id="swLandL" role="button" tabindex="0">
                        <span class="flip-pos-lbl">ON</span>
                        <div class="flip-track"><div class="flip-lever"></div></div>
                        <span class="flip-pos-lbl">OFF</span>
                        <span class="flip-name">LAND L</span>
                    </div>
                    <div class="flip-sw" id="swLandR" role="button" tabindex="0">
                        <span class="flip-pos-lbl">ON</span>
                        <div class="flip-track"><div class="flip-lever"></div></div>
                        <span class="flip-pos-lbl">OFF</span>
                        <span class="flip-name">LAND R</span>
                    </div>
                    <div class="flip-sw" id="swRwyTo" role="button" tabindex="0">
                        <span class="flip-pos-lbl">ON</span>
                        <div class="flip-track"><div class="flip-lever"></div></div>
                        <span class="flip-pos-lbl">OFF</span>
                        <span class="flip-name">RWY TO</span>
                    </div>
                </div>
                <div class="lights-3pos-row">
                    <div class="flip-sw-3" id="swStrobe" data-pos="1" role="button" tabindex="0">
                        <div class="flip3-inner">
                            <div class="flip3-labels">
                                <span>ON</span>
                                <span>AUTO</span>
                                <span>OFF</span>
                            </div>
                            <div class="flip3-track"><div class="flip3-lever"></div></div>
                        </div>
                        <span class="flip-name">STROBE</span>
                    </div>
                    <div class="flip-sw-3" id="swNose" data-pos="2" role="button" tabindex="0">
                        <div class="flip3-inner">
                            <div class="flip3-labels">
                                <span>TAXI</span>
                                <span>T.O</span>
                                <span>OFF</span>
                            </div>
                            <div class="flip3-track"><div class="flip3-lever"></div></div>
                        </div>
                        <span class="flip-name">NOSE</span>
                    </div>
                </div>
            </div>

            <div class="ovhd-section packs-panel">
                <div class="ovhd-section-label">PACKS</div>
                <div class="packs-grid">
                    <div class="pack-btn-wrap">
                        <span class="pack-label">PACK 1</span>
                        <div class="pack-housing">
                            <button type="button" id="btnPack1" class="pack-btn">
                                <div class="pack-off-ind">OFF</div>
                            </button>
                        </div>
                    </div>
                    <div class="pack-btn-wrap">
                        <span class="pack-label">PACK 2</span>
                        <div class="pack-housing">
                            <button type="button" id="btnPack2" class="pack-btn">
                                <div class="pack-off-ind">OFF</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="center-zone">
            <div class="nav-bar">
                <button id="showCams" class="nav-btn active">CAMERAS</button>
                <button id="showOfp" class="nav-btn">OFP</button>
            </div>

            <div class="grid-container">
                <div id="camGrid" class="grid-layer active"></div>
            </div>
            <div id="metarContainer" class="metar-container hidden">
                <div id="metarContent" class="metar-content"></div>
                <button id="metarRefreshBtn" class="metar-refresh-btn" title="Refresh METAR">↻</button>
                <button id="ofpRefreshBtn" class="metar-refresh-btn ofp-refresh-btn" title="Refresh SimBrief PDF">PDF ↻</button>
            </div>
            <div id="ofpContainer" class="ofp-container hidden"></div>
            <div id="ofpCameraButtons" class="ofp-camera-buttons hidden"></div>

            <div class="pedestal-row hidden">
                <div class="b777-gear-container">
                    <span class="label">GEAR</span>
                    <div class="b777-gear-track">
                        <div id="gearHandle" class="b777-gear-arm gear-up">
                            <div class="b777-gear-knob"></div>
                        </div>
                    </div>
                </div>

                <div class="v-group" style="padding-left: 30px;">
                    <span class="label">FLAPS</span>
                    <div class="center-v-wrap">
                        <div id="flapLabels" class="flap-labels-container"></div>
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="fSlider">
                    </div>
                    <div class="spacer-btn"></div>
                </div>

                <div class="v-group">
                    <span class="label">SPOIL</span>
                    <div class="center-v-wrap">
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="sSlider">
                    </div>
                    <button id="armBtn" class="sub-btn blue-btn">ARM SPOILERS</button>
                </div>

                <div class="v-group">
                    <span class="label">BRAKE</span>
                    <div class="center-v-wrap">
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="bSlider">
                    </div>
                    <button id="pbBtn" class="sub-btn red-btn">PARKING BRAKE</button>
                </div>

                <div class="ap-btn-wrap">
                    <button id="apBtn" class="ap-btn">
                        <div id="apIndicator" class="ap-indicator"></div>
                        A/P
                    </button>
                </div>
            </div>

            <div class="ovhd-section eng-start-panel hidden">
                <div class="ovhd-section-label">ENG START</div>
                <div class="eng-start-inner">
                    <div class="eng-mode-row">
                        <button type="button" class="eng-mode-pos ovhd-btn" data-mode="0">
                            <span class="btn-label">CRANK</span>
                            <div class="btn-led"></div>
                        </button>
                        <button type="button" class="eng-mode-pos ovhd-btn selected" data-mode="1">
                            <span class="btn-label">NORM</span>
                            <div class="btn-led"></div>
                        </button>
                        <button type="button" class="eng-mode-pos ovhd-btn" data-mode="2">
                            <span class="btn-label">IGN</span>
                            <div class="btn-led"></div>
                        </button>
                    </div>
                    <div class="eng-masters-row">
                        <button type="button" id="btnEng1" class="ovhd-btn eng-master">
                            <span class="btn-label">ENG 1</span>
                            <span class="btn-sub">MASTER</span>
                            <div class="btn-led">ON</div>
                        </button>
                        <button type="button" id="btnEng2" class="ovhd-btn eng-master">
                            <span class="btn-label">ENG 2</span>
                            <span class="btn-sub">MASTER</span>
                            <div class="btn-led">ON</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="throttle-zone a320">
            <span class="label">THROTTLE</span>
            <div id="throttleLabels" class="throttle-labels-container"></div>
            <div class="t-v-wrap">
                <input type="range" min="0" max="1" step="0.001" value="0" class="t-slider" id="tSlider">
            </div>
            <button id="idleBtn" class="btn-rev" style="background: #444; margin-bottom: 8px;">IDLE</button>
            <button id="revBtn" class="btn-rev" style="margin-bottom: 8px;">REVERSE</button>

            <div class="ovhd-section apu-panel">
                <div class="ovhd-section-label">APU</div>
                <div class="apu-grid">
                    <button type="button" id="btnApuMaster" class="ovhd-btn">
                        <span class="btn-label">MASTER</span>
                        <div class="btn-led">AVAIL</div>
                    </button>
                    <button type="button" id="btnApuStart" class="ovhd-btn">
                        <span class="btn-label">START</span>
                        <div class="btn-led">ON</div>
                    </button>
                    <button type="button" id="btnApuBleed" class="ovhd-btn">
                        <span class="btn-label">BLEED</span>
                        <div class="btn-led">ON</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>window.DEBUG_UI = {{ 'true' if debug_ui else 'false' }};</script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('serve_profile', profile_name=profile_name + '.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
