<!DOCTYPE html>
<html>
<head>
    <title>MSFS Glass Cockpit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="screen-layout">
        <div class="left-column fenix-ovhd-dense">
            <div class="tod-panel">
                <div id="utcClock" class="utc-clock">--:--Z</div>
                <div class="tod-input-row">
                    <input id="todHour" class="tod-input" type="number" min="0" max="23" placeholder="HH">
                    <span class="tod-separator">:</span>
                    <input id="todMinute" class="tod-input" type="number" min="0" max="59" placeholder="MM">
                    <button id="todSetBtn" class="tod-btn">SET TD</button>
                </div>
                <div id="todStatus" class="tod-status"></div>
            </div>

            <div id="leftBrakeContainer" class="left-brake-container hidden">
                <div class="v-group">
                    <span class="label">BRAKE</span>
                    <div class="center-v-wrap">
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="bSliderLeft">
                    </div>
                    <button id="pbBtnLeft" class="sub-btn red-btn">PARKING BRAKE</button>
                </div>
            </div>

            <div class="left-ovhd-pair">
                <div class="ovhd-section packs-panel ovhd-flush">
                    <div class="fuel-pumps-row">
                        <div class="fuel-pumps-group">
                            <span class="fuel-pumps-group-title">L TK</span>
                            <div class="fuel-pumps-group-btns">
                                <div class="pack-btn-wrap">
                                    <span class="pack-label">1</span>
                                    <div class="pack-housing">
                                        <button type="button" id="btnFuelLt1" class="pack-btn off">
                                            <div class="pack-fault">FAULT</div>
                                            <div class="pack-off-ind">OFF</div>
                                        </button>
                                    </div>
                                </div>
                                <div class="pack-btn-wrap">
                                    <span class="pack-label">2</span>
                                    <div class="pack-housing">
                                        <button type="button" id="btnFuelLt2" class="pack-btn off">
                                            <div class="pack-fault">FAULT</div>
                                            <div class="pack-off-ind">OFF</div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="fuel-pumps-group">
                            <span class="fuel-pumps-group-title">CTR TK</span>
                            <div class="fuel-pumps-group-btns">
                                <div class="pack-btn-wrap">
                                    <span class="pack-label">1</span>
                                    <div class="pack-housing">
                                        <button type="button" id="btnFuelCtr1" class="pack-btn off">
                                            <div class="pack-fault">FAULT</div>
                                            <div class="pack-off-ind">OFF</div>
                                        </button>
                                    </div>
                                </div>
                                <div class="pack-btn-wrap">
                                    <span class="pack-label">2</span>
                                    <div class="pack-housing">
                                        <button type="button" id="btnFuelCtr2" class="pack-btn off">
                                            <div class="pack-fault">FAULT</div>
                                            <div class="pack-off-ind">OFF</div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="fuel-pumps-group">
                            <span class="fuel-pumps-group-title">R TK</span>
                            <div class="fuel-pumps-group-btns">
                                <div class="pack-btn-wrap">
                                    <span class="pack-label">1</span>
                                    <div class="pack-housing">
                                        <button type="button" id="btnFuelRt1" class="pack-btn off">
                                            <div class="pack-fault">FAULT</div>
                                            <div class="pack-off-ind">OFF</div>
                                        </button>
                                    </div>
                                </div>
                                <div class="pack-btn-wrap">
                                    <span class="pack-label">2</span>
                                    <div class="pack-housing">
                                        <button type="button" id="btnFuelRt2" class="pack-btn off">
                                            <div class="pack-fault">FAULT</div>
                                            <div class="pack-off-ind">OFF</div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="ovhd-pbpair-row">
                        <div class="ovhd-pbpair-btns">
                            <div class="pack-btn-wrap">
                                <span class="pack-label">BAT 1</span>
                                <div class="pack-housing">
                                    <button type="button" id="btnBat1" class="pack-btn off">
                                        <div class="pack-fault">FAULT</div>
                                        <div class="pack-off-ind">OFF</div>
                                    </button>
                                </div>
                            </div>
                            <div class="pack-btn-wrap">
                                <span class="pack-label">BAT 2</span>
                                <div class="pack-housing">
                                    <button type="button" id="btnBat2" class="pack-btn off">
                                        <div class="pack-fault">FAULT</div>
                                        <div class="pack-off-ind">OFF</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="packs-stack">
                        <div class="packs-row packs-row-endcaps">
                            <div class="pack-btn-wrap">
                                <span class="pack-label">PACK 1</span>
                                <div class="pack-housing">
                                    <button type="button" id="btnPack1" class="pack-btn">
                                        <div class="pack-fault">FAULT</div>
                                        <div class="pack-off-ind">OFF</div>
                                    </button>
                                </div>
                            </div>
                            <div class="pack-btn-wrap">
                                <span class="pack-label">PACK 2</span>
                                <div class="pack-housing">
                                    <button type="button" id="btnPack2" class="pack-btn">
                                        <div class="pack-fault">FAULT</div>
                                        <div class="pack-off-ind">OFF</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="packs-row packs-row-center">
                            <div class="pack-btn-wrap pack-apu-wrap">
                                <span class="pack-label">APU BLEED</span>
                                <div class="pack-housing pack-apu-housing">
                                    <button type="button" id="btnApuBleed" class="pack-btn pack-apu off">
                                        <div class="pack-off-ind pack-apu-readout">ON</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ovhd-section lights-panel ovhd-flush">
                    <div class="ext-lt-panel" id="extLtLightsHost">
                        <div class="ext-lt-viewport" id="extLtLightsViewport" tabindex="0" role="region" aria-label="Exterior lights"></div>
                    </div>
                </div>
                <div class="ovhd-section apu-oh-stack ovhd-flush">
                    <div class="apu-oh-row">
                        <div class="pack-btn-wrap">
                            <span class="pack-label">MASTER SW</span>
                            <div class="pack-housing pack-apu-housing">
                                <button type="button" id="btnApuMasterOh" class="pack-btn pack-apu off">
                                    <div class="pack-off-ind pack-apu-readout">ON</div>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="apu-oh-row">
                        <div class="pack-btn-wrap">
                            <span class="pack-label">START</span>
                            <div class="pack-housing">
                                <button type="button" id="btnApuStartOh" class="pack-btn pack-apu-start off">
                                    <div class="apu-start-avail">AVAIL</div>
                                    <div class="pack-fault">FAULT</div>
                                    <div class="pack-apu-start-on">ON</div>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="apu-oh-row eng-mode-oh-row">
                        <div class="eng-mode-horiz" id="engModeOhRoot" data-pos="1">
                            <div class="eng-mode-3d-host">
                                <div class="eng-mode-3d-viewport" id="engMode3dViewport" tabindex="0" role="region" aria-label="Engine mode"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="center-zone">
            <div class="nav-bar">
                <button id="showCams" class="nav-btn active">CAMERAS</button>
                <button id="showOfp" class="nav-btn">OFP</button>
            </div>

            <div class="grid-container">
                <div id="camGrid" class="grid-layer active"></div>
            </div>
            <div id="metarContainer" class="metar-container hidden">
                <div id="metarContent" class="metar-content"></div>
                <button id="metarRefreshBtn" class="metar-refresh-btn" title="Refresh METAR">↻</button>
                <button id="ofpRefreshBtn" class="metar-refresh-btn ofp-refresh-btn" title="Refresh SimBrief PDF">PDF ↻</button>
            </div>
            <div id="ofpContainer" class="ofp-container hidden"></div>
            <div id="ofpCameraButtons" class="ofp-camera-buttons hidden"></div>

            <div class="pedestal-row hidden">
                <div class="b777-gear-container">
                    <span class="label">GEAR</span>
                    <div class="b777-gear-track">
                        <div id="gearHandle" class="b777-gear-arm gear-up">
                            <div class="b777-gear-knob"></div>
                        </div>
                    </div>
                </div>

                <div class="v-group" style="padding-left: 30px;">
                    <span class="label">FLAPS</span>
                    <div class="center-v-wrap">
                        <div id="flapLabels" class="flap-labels-container"></div>
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="fSlider">
                    </div>
                    <div class="spacer-btn"></div>
                </div>

                <div class="v-group">
                    <span class="label">SPOIL</span>
                    <div class="center-v-wrap">
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="sSlider">
                    </div>
                    <button id="armBtn" class="sub-btn blue-btn">ARM SPOILERS</button>
                </div>

                <div class="v-group">
                    <span class="label">BRAKE</span>
                    <div class="center-v-wrap">
                        <input type="range" min="0" max="1" step="0.001" value="0" class="center-v-slider" id="bSlider">
                    </div>
                    <button id="pbBtn" class="sub-btn red-btn">PARKING BRAKE</button>
                </div>

                <div class="ap-btn-wrap">
                    <button id="apBtn" class="ap-btn">
                        <div id="apIndicator" class="ap-indicator"></div>
                        A/P
                    </button>
                </div>
            </div>
        </div>

        <div class="throttle-zone a320">
            <span class="label">THROTTLE</span>
            <div id="throttleLabels" class="throttle-labels-container"></div>
            <div class="t-v-wrap">
                <input type="range" min="0" max="1" step="0.001" value="0" class="t-slider" id="tSlider">
            </div>
            <button id="idleBtn" class="btn-rev" style="background: #444; margin-bottom: 8px;">IDLE</button>
            <button id="revBtn" class="btn-rev" style="margin-bottom: 8px;">REVERSE</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('serve_profile', profile_name=profile_name + '.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
