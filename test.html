<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A320 Throttle — STL Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0f12;
      color: #b0c4d8;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #hdr {
      padding: 10px 20px;
      background: #07090c;
      border-bottom: 1px solid #1a2535;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    #hdr .logo {
      font-size: .95rem;
      letter-spacing: .18em;
      color: #d4820a;
      font-weight: bold;
    }

    #hdr .sub {
      font-size: .6rem;
      color: #334455;
      letter-spacing: .1em;
    }

    #hdr .sep {
      flex: 1;
    }

    #hdr .tla {
      font-size: .7rem;
      color: #50a050;
    }

    #hdr .tla span {
      color: #90e090;
    }

    #wrap {
      flex: 1;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #ctrl {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 9, 12, 0.88);
      border: 1px solid #1a2535;
      border-radius: 3px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      backdrop-filter: blur(10px);
    }

    #ctrl label {
      font-size: .6rem;
      color: #334455;
      letter-spacing: .1em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    #ctrl .val {
      font-size: .75rem;
      color: #d4820a;
      text-align: center;
      margin-top: 4px;
      min-width: 6em;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 180px;
      height: 3px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, #d4820a var(--p, 30%), #1a2535 var(--p, 30%));
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #d4820a;
      border: 2px solid #0d0f12;
      box-shadow: 0 0 5px #d4820a88;
    }

    #hint {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: .58rem;
      color: #1e2e3e;
      line-height: 1.9;
      text-align: right;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0f12;
      gap: 12px;
    }

    #loading .msg {
      font-size: .75rem;
      color: #334455;
      letter-spacing: .1em;
    }

    #loading .bar-wrap {
      width: 200px;
      height: 2px;
      background: #1a2535;
      border-radius: 1px;
    }

    #loading .bar {
      height: 100%;
      background: #d4820a;
      border-radius: 1px;
      width: 0%;
      transition: width .3s;
    }
  </style>
</head>

<body>

  <div id="hdr">
    <div class="logo">A320 · THROTTLE</div>
    <div class="sub">THRUST LEVER ASSEMBLY — STL RENDER</div>
    <div class="sep"></div>
    <div class="tla">TLA <span id="tlaval">CLB</span></div>
  </div>

  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="loading">

      <div class="bar-wrap">

      </div>
    </div>
    <div id="hint">DRAG · orbit<br>SCROLL · zoom<br>SLIDER · TLA</div>
  </div>

      <input type="range" id="sl" min="0" max="100" value="30">
      <div class="val" id="vl">CLB</div>
    </div>
  </div>

    // ── Decode base64 → ArrayBuffer ──
    function b64toAB(s) {
      const bin = atob(s);
      const ab = new ArrayBuffer(bin.length);
      const u8 = new Uint8Array(ab);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return ab;
    }

    // ── Parse binary STL → BufferGeometry ──
    function parseBinarySTL(ab) {
      const view = new DataView(ab);
      const triCount = view.getUint32(80, true);
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(triCount * 9);
      const normals = new Float32Array(triCount * 9);
      let off = 84, pi = 0, ni = 0;
      for (let i = 0; i < triCount; i++) {
        const nx = view.getFloat32(off, true), ny = view.getFloat32(off + 4, true), nz = view.getFloat32(off + 8, true);
        off += 12;
        for (let v = 0; v < 3; v++) {
          positions[pi++] = view.getFloat32(off, true);
          positions[pi++] = view.getFloat32(off + 4, true);
          positions[pi++] = view.getFloat32(off + 8, true);
          off += 12;
          normals[ni++] = nx; normals[ni++] = ny; normals[ni++] = nz;
        }
        off += 2; // attr
      }
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
      return geo;
    }

    window.addEventListener("mouseup", () => drag = false);

      if (!drag) return;
      sph.th -= (e.clientX - px) * 0.006; sph.ph = Math.max(0.12, Math.min(1.45, sph.ph + (e.clientY - py) * 0.006));
      px = e.clientX; py = e.clientY;

              return "IDLE";
            }

            function pctToAngle(p) {
              return THREE.MathUtils.lerp(-35, 28, Math.min(p, 80) / 100) * Math.PI / 180;
            }
            // Z travel: forward at TOGA (negative Z in scene = toward camera front)
            function pctToZ(p) {
              if (p <= 70) return THREE.MathUtils.lerp(14, 2, p / 70);
              if (p <= 80) return THREE.MathUtils.lerp(2, -10, (p - 70) / 10);
              return THREE.MathUtils.lerp(-10, -22, (p - 80) / 20);
            }

            const DETENT_PCTS = [0, 70, 80, 100];
            let lockDetent = null;
            const SNAP_BAND = 4.5;
            const RELEASE_BAND = 8.0;

            function applyDetents(rawP) {
              let p = rawP;
              if (lockDetent !== null) {
                if (Math.abs(p - lockDetent) <= RELEASE_BAND) return lockDetent;
                lockDetent = null;
              }
              for (let i = 0; i < DETENT_PCTS.length; i++) {
                const d = DETENT_PCTS[i];
                if (Math.abs(p - d) <= SNAP_BAND) {
                  lockDetent = d;
                  return d;
                }
              }
              return p;
            }

            function update() {
              const rawP = parseFloat(sl.value);
              const p = applyDetents(rawP);
              if (p !== rawP) sl.value = String(p);
              sl.style.setProperty("--p", p + "%");
              const lbl = pctToLabel(p);
              vl.textContent = lbl;
              tlaval.textContent = lbl;
              // Animate pivot
              pivotGroup.rotation.x = -pctToAngle(p);
              pivotGroup.position.x = BASE_CX;
              pivotGroup.position.y = TOP_Y;
              pivotGroup.position.z = BASE_CZ + pctToZ(p);
            }

            sl.addEventListener("input", update);
            update();

            // Initial camera position
            const geoBB = geo.boundingBox;
            const h = geoBB.max.y - geoBB.min.y;
            sph.r = Math.max(h * 2.8, 200);
            tgt.set(0, h * 0.45, 0);

            setProgress(100, "READY");
            setTimeout(() => { loadDiv.style.display = "none"; }, 300);

          }, 50);
        }, 50);
      }, 20);
    }, 20);

    // ── Render loop ──
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      camera.position.set(
        tgt.x + sph.r * Math.sin(sph.ph) * Math.sin(sph.th),
        tgt.y + sph.r * Math.cos(sph.ph),
        tgt.z + sph.r * Math.sin(sph.ph) * Math.cos(sph.th)
      );
      camera.lookAt(tgt);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
