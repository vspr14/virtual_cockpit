<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>A320 Dull Mode Selector</title> 
    <style> 
        body { margin: 0; background-color: #050505; overflow: hidden; font-family: 'Segoe UI', sans-serif; } 
        #ui {  
            position: absolute; bottom: 30px; width: 100%; text-align: center;  
            color: #666; text-transform: uppercase; letter-spacing: 3px; font-size: 11px; pointer-events: none; 
        } 
    </style> 
</head> 
<body> 

    <div id="ui">ENG MODE | <span id="status" style="color:#999">NORM</span></div> 
    
    <script type="importmap"> 
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
            } 
        } 
    </script> 
    <script type="module"> 
        import * as THREE from 'three'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 

        const scene = new THREE.Scene(); 
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000); 
        camera.position.set(0, -6, 8);  

        const renderer = new THREE.WebGLRenderer({ antialias: true }); 
        renderer.setSize(window.innerWidth, window.innerHeight); 
        renderer.toneMapping = THREE.LinearToneMapping; // Switched to Linear for a flatter look
        renderer.toneMappingExposure = 1.2; 
        document.body.appendChild(renderer.domElement); 

        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true; 

        // --- Dull "Work" Lighting ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.4)); 
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2); 
        keyLight.position.set(5, -5, 10); 
        scene.add(keyLight); 

        // --- Dull Materials ---
        const airbusGrey = new THREE.MeshStandardMaterial({ color: 0x2a323a, roughness: 1.0 }); 
        
        // Dull, slightly "Nicotine" aged off-white
        const dullPlastic = new THREE.MeshStandardMaterial({ 
            color: 0xbcbcbc, 
            roughness: 1.0, 
            metalness: 0.0 
        }); 

        const dullIndicator = new THREE.MeshBasicMaterial({ 
            color: 0x1a1a1a, 
            transparent: true, 
            opacity: 0.7 
        }); 

        const root = new THREE.Group(); 
        root.rotation.x = -Math.PI / 6; 
        scene.add(root); 

        // 1. Panel (Darker)
        const panel = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 0.2), airbusGrey);
        root.add(panel); 

        // 2. The Fixed Base Plate (Shimmed to avoid Z-fighting)
        const basePlate = new THREE.Mesh(
            new THREE.CylinderGeometry(1.15, 1.15, 0.05, 64), 
            dullPlastic
        ); 
        basePlate.rotation.x = Math.PI / 2; 
        basePlate.position.z = 0.12; 
        root.add(basePlate); 

        // 3. The Knob Assembly
        const knobPivot = new THREE.Group(); 
        knobPivot.position.z = 0.15; 
        root.add(knobPivot); 

        const barShape = new THREE.Shape(); 
        barShape.moveTo(0, 1.1); 
        barShape.quadraticCurveTo(0.3, 1.05, 0.5, 0.85); 
        barShape.lineTo(0.5, -1.0); 
        barShape.quadraticCurveTo(0, -1.3, -0.5, -1.0); 
        barShape.lineTo(-0.5, 0.85); 
        barShape.quadraticCurveTo(-0.3, 1.05, 0, 1.1); 

        const barGeom = new THREE.ExtrudeGeometry(barShape, {
            depth: 1.1, 
            bevelEnabled: true, 
            bevelSize: 0.04, 
            bevelThickness: 0.04,
            bevelSegments: 2 // Reduced segments for "sharper" feel
        }); 
        const bar = new THREE.Mesh(barGeom, dullPlastic); 
        knobPivot.add(bar); 

        // Indicator Line (More faint)
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.1, 0.02), dullIndicator); 
        line.position.set(0, 0.55, 1.15); 
        knobPivot.add(line); 

        // --- Logic --- 
        let state = 1; 
        const angles = [Math.PI / 4, 0, -Math.PI / 4]; 
        const labels = ["CRANK", "NORM", "IGN / START"]; 
        let isDragging = false; 
        let startY = 0; 

        window.addEventListener('pointerdown', (e) => { 
            const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(bar).length > 0) { 
                isDragging = true; 
                startY = e.clientY; 
                controls.enabled = false; 
            } 
        }); 

        window.addEventListener('pointermove', (e) => { 
            if (!isDragging) return; 
            const diff = e.clientY - startY; 
            if (Math.abs(diff) > 50) { 
                if (diff > 0 && state > 0) state--; 
                else if (diff < 0 && state < 2) state++; 
                startY = e.clientY; 
                document.getElementById('status').innerText = labels[state]; 
            } 
        }); 

        window.addEventListener('pointerup', () => { isDragging = false; controls.enabled = true; }); 

        function animate() { 
            requestAnimationFrame(animate); 
            knobPivot.rotation.z = THREE.MathUtils.lerp(knobPivot.rotation.z, angles[state], 0.2); 
            controls.update(); 
            renderer.render(scene, camera); 
        } 
        animate(); 
    </script> 
</body> 
</html>
