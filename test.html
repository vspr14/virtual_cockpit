
<h2 class="sr-only">Interactive 3D render of Korry MSC489 knob built from spec sheet dimensions</h2>
<div id="wrap" style="width:100%;height:520px;background:#1a1c1e;border-radius:8px;overflow:hidden;position:relative;touch-action:none">
  <div id="lbl" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#3a5560;font:10px/1 'Courier New',monospace;letter-spacing:.22em;white-space:nowrap;z-index:2">KORRY MSC 489 — 12-FLUTE KNOB</div>
  <div id="ang" style="position:absolute;top:32px;left:50%;transform:translateX(-50%);color:#e09020;font:11px/1 'Courier New',monospace;letter-spacing:.18em;z-index:2">0°</div>
  <div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2">
    <button onclick="snap(-45)" style="background:#1e2428;border:1px solid #354045;color:#7a9fa8;font:10px/1 'Courier New',monospace;letter-spacing:.1em;padding:6px 12px;border-radius:2px;cursor:pointer">-45°</button>
    <button onclick="snap(0)"   style="background:#1e2428;border:1px solid #354045;color:#7a9fa8;font:10px/1 'Courier New',monospace;letter-spacing:.1em;padding:6px 12px;border-radius:2px;cursor:pointer">0°</button>
    <button onclick="snap(45)"  style="background:#1e2428;border:1px solid #354045;color:#7a9fa8;font:10px/1 'Courier New',monospace;letter-spacing:.1em;padding:6px 12px;border-radius:2px;cursor:pointer">+45°</button>
    <button onclick="snap(90)"  style="background:#1e2428;border:1px solid #354045;color:#7a9fa8;font:10px/1 'Courier New',monospace;letter-spacing:.1em;padding:6px 12px;border-radius:2px;cursor:pointer">+90°</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const wrap=document.getElementById('wrap');
const W=wrap.clientWidth,H=wrap.clientHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
wrap.appendChild(renderer.domElement);
renderer.domElement.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1c1e);
const cam=new THREE.PerspectiveCamera(36,W/H,0.01,100);

scene.add(new THREE.AmbientLight(0x303840,1.2));
const key=new THREE.SpotLight(0xfff5e8,3.5,30,Math.PI/7,0.3,1.5);
key.position.set(2.5,4,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const fl=new THREE.DirectionalLight(0x304860,0.7);fl.position.set(-3,2,1);scene.add(fl);
const rl=new THREE.DirectionalLight(0x1a2830,0.4);rl.position.set(0,-2,-3);scene.add(rl);

const matBody=new THREE.MeshStandardMaterial({color:0x1c1e20,roughness:0.45,metalness:0.05});
const matInd=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5,metalness:0,emissive:0xffffff,emissiveIntensity:0.2});
const matInsert=new THREE.MeshStandardMaterial({color:0xb0b4b8,roughness:0.3,metalness:0.8});
const matPanel=new THREE.MeshStandardMaterial({color:0x1e2224,roughness:0.88,metalness:0.1});

const S=2.5,R=0.50*S,H2=0.84*S,Hr=0.06*S,skH=0.16*S,skR=0.52*S;
const knob=new THREE.Group();

// lathe body
const pts=[];
pts.push(new THREE.Vector2(0,0));
pts.push(new THREE.Vector2(skR,0));
pts.push(new THREE.Vector2(skR,skH*0.6));
pts.push(new THREE.Vector2(R,skH));
pts.push(new THREE.Vector2(R,H2-Hr));
for(let i=0;i<=8;i++){
  const a=-Math.PI/2+(Math.PI/2)*(i/8);
  pts.push(new THREE.Vector2(R-Hr+Hr*Math.cos(a),H2-Hr+Hr*Math.sin(a)));
}
pts.push(new THREE.Vector2(0,H2));
const body=new THREE.Mesh(new THREE.LatheGeometry(pts,64),matBody);
body.castShadow=true;body.receiveShadow=true;
knob.add(body);

// 12 flutes
const FD=0.045*S,FW=0.075*S;
const fH=H2-skH-Hr*2;
const fluteMat=new THREE.MeshStandardMaterial({color:0x080a0c,roughness:0.9,metalness:0});
const ridgeMat=new THREE.MeshStandardMaterial({color:0x2e3236,roughness:0.4,metalness:0.1});
for(let i=0;i<12;i++){
  const ang=(i/12)*Math.PI*2;
  const fx=Math.sin(ang)*(R-FD*0.3),fz=Math.cos(ang)*(R-FD*0.3);
  const fl2=new THREE.Mesh(new THREE.BoxGeometry(FW,fH,FD*2),fluteMat);
  fl2.position.set(fx,skH+fH/2+Hr,fz);fl2.rotation.y=-ang;
  knob.add(fl2);
  [-1,1].forEach(side=>{
    const ra=ang+side*(Math.PI*2/12)*0.45;
    const rg=new THREE.Mesh(new THREE.BoxGeometry(0.012*S,fH,0.012*S),ridgeMat);
    rg.position.set(Math.sin(ra)*(R+0.001),skH+fH/2+Hr,Math.cos(ra)*(R+0.001));
    knob.add(rg);
  });
}

// top face
const topF=new THREE.Mesh(new THREE.CircleGeometry(R-Hr,64),matBody);
topF.rotation.x=-Math.PI/2;topF.position.y=H2;knob.add(topF);

// indicator line top
const iTop=new THREE.Mesh(new THREE.BoxGeometry(0.06*S,0.012,(R-Hr)*0.75),matInd);
iTop.position.set(0,H2+0.006,-(R-Hr)*0.375);knob.add(iTop);

// indicator line side
const iSide=new THREE.Mesh(new THREE.BoxGeometry(0.04*S,fH,0.008*S),matInd);
iSide.position.set(0,skH+fH/2+Hr,-(R+0.002));knob.add(iSide);

// brass insert
const ins=new THREE.Mesh(new THREE.CylinderGeometry(0.14*S,0.14*S,0.30*S,24),matInsert);
ins.position.y=0.15*S;knob.add(ins);
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.064*S,0.064*S,0.35*S,20),
  new THREE.MeshStandardMaterial({color:0x000000,roughness:0.9}));
shaft.position.y=0.14*S;knob.add(shaft);

scene.add(knob);

// panel
const panel=new THREE.Mesh(new THREE.PlaneGeometry(8,8),matPanel);
panel.rotation.x=-Math.PI/2;panel.position.y=-0.01;panel.receiveShadow=true;
scene.add(panel);

// camera
const sph=new THREE.Spherical(3.8,Math.PI/3.5,0);
function updateCam(){
  cam.position.setFromSpherical(sph);cam.lookAt(0,0.4,0);
}
updateCam();

let tgt=0,cur=0;
window.snap=function(deg){
  tgt=deg*Math.PI/180;
  document.getElementById('ang').textContent=deg+'°';
};

let drag=false,px=0,py=0,mx=0,my=0;
wrap.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY;mx=e.clientX;my=e.clientY});
window.addEventListener('mouseup',e=>{
  if(drag&&Math.abs(e.clientX-mx)<3&&Math.abs(e.clientY-my)<3){
    const steps=[0,45,90,135,180,-135,-90,-45];
    const c=Math.round(cur*180/Math.PI);
    const idx=steps.findIndex(s=>s===c);
    const nxt=steps[(idx+1)%steps.length];
    window.snap(nxt);
  }
  drag=false;
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  sph.theta-=(e.clientX-px)*0.009;
  sph.phi=Math.max(0.15,Math.min(1.8,sph.phi+(e.clientY-py)*0.007));
  updateCam();px=e.clientX;py=e.clientY;
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  sph.radius=Math.max(1.5,Math.min(10,sph.radius+e.deltaY*0.005));
  updateCam();
},{passive:false});

// touch
let lt=0;
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY;mx=px;my=py;}
  if(e.touches.length===2){lt=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&drag){
    sph.theta-=(e.touches[0].clientX-px)*0.012;
    sph.phi=Math.max(0.15,Math.min(1.8,sph.phi+(e.touches[0].clientY-py)*0.01));
    updateCam();px=e.touches[0].clientX;py=e.touches[0].clientY;
  }
  if(e.touches.length===2){
    const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    sph.radius=Math.max(1.5,Math.min(10,sph.radius-(nd-lt)*0.01));
    updateCam();lt=nd;
  }
},{passive:false});

window.addEventListener('resize',()=>{
  const nw=wrap.clientWidth,nh=wrap.clientHeight;
  cam.aspect=nw/nh;cam.updateProjectionMatrix();
  renderer.setSize(nw,nh);
});

function animate(){
  requestAnimationFrame(animate);
  cur+=(tgt-cur)*0.10;
  knob.rotation.y=cur;
  renderer.render(scene,cam);
}
animate();
})();
</script>
