<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>WX Toggle Switches</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #2e3845;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 10px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden
    }

    #states {
      color: #fff;
      font: 600 10px/1 "Helvetica Neue", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, .45);
      padding: 5px 14px;
      border-radius: 8px;
      display: flex;
      gap: 16px
    }

    #hint {
      color: rgba(255, 255, 255, .22);
      font: 9px/1 "Helvetica Neue", sans-serif;
      letter-spacing: .1em
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="states">
    <span id="s-sys">SYS: OFF</span>
    <span id="s-pws">PWS: OFF</span>
  </div>
  <div id="hint">click switch · right-drag = orbit · scroll = zoom</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const W = 500, H = 360;
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setSize(W, H); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2e3845);
    const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 2000);
    cam.position.set(0, 30, 220); cam.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0x303c48, 1.15));
    const key = new THREE.SpotLight(0xfff8f0, 2.6, 600, Math.PI / 7, 0.28, 1.2);
    key.position.set(80, 160, 180); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
    const fill = new THREE.DirectionalLight(0x405878, 0.5); fill.position.set(-80, 40, 80); scene.add(fill);
    const back = new THREE.DirectionalLight(0x101820, 0.2); back.position.set(0, -60, -40); scene.add(back);

    const matPanel = new THREE.MeshStandardMaterial({ color: 0x5a6878, roughness: 0.72, metalness: 0.38 });
    const matPanelFace = new THREE.MeshStandardMaterial({ color: 0x4e5e6e, roughness: 0.78, metalness: 0.32 });
    const matSwBody = new THREE.MeshStandardMaterial({ color: 0x909aa4, roughness: 0.18, metalness: 0.95 });
    const matSwShiny = new THREE.MeshStandardMaterial({ color: 0xb8c4ce, roughness: 0.08, metalness: 0.98 });
    const matBushing = new THREE.MeshStandardMaterial({ color: 0x303840, roughness: 0.5, metalness: 0.7 });
    const matHole = new THREE.MeshBasicMaterial({ color: 0x050809, toneMapped: false });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x283038, roughness: 0.55, metalness: 0.6 });

    // ── PANEL ──
    const PW = 200, PH = 120, PD = 10;
    const panel = new THREE.Mesh(new THREE.BoxGeometry(PW, PH, PD), matPanel);
    panel.receiveShadow = true; scene.add(panel);
    const face = new THREE.Mesh(new THREE.BoxGeometry(PW - 6, PH - 6, 1.2), matPanelFace);
    face.position.z = PD / 2 + 0.5; scene.add(face);
    [[0, PH / 2 + 2, new THREE.BoxGeometry(PW + 8, 4, PD + 2)],
    [0, -PH / 2 - 2, new THREE.BoxGeometry(PW + 8, 4, PD + 2)],
    [PW / 2 + 2, 0, new THREE.BoxGeometry(4, PH, PD + 2)],
    [-PW / 2 - 2, 0, new THREE.BoxGeometry(4, PH, PD + 2)]
    ].forEach(([x, y, geo]) => {
      const m = new THREE.Mesh(geo, trimMat); m.position.set(x, y, 0); scene.add(m);
    });
    // Corner holes
    [[-PW / 2 + 8, -PH / 2 + 8], [PW / 2 - 8, -PH / 2 + 8], [-PW / 2 + 8, PH / 2 - 8], [PW / 2 - 8, PH / 2 - 8]].forEach(([x, y]) => {
      const h = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 1.5, 16), matBushing);
      h.rotation.x = Math.PI / 2; h.position.set(x, y, PD / 2 + 0.6); scene.add(h);
      const i = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 2, 12), matHole);
      i.rotation.x = Math.PI / 2; i.position.set(x, y, PD / 2 + 0.8); scene.add(i);
    });

    // ── LABEL HELPER ──
    function makeLabel(txt, size = 26, color = '#c8d4de') {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 72;
      const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, 256, 72);
      ctx.font = `bold ${size}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
      ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, 128, 36);
      const t = new THREE.CanvasTexture(cv); t.minFilter = THREE.LinearFilter; return t;
    }
    function addLabel(txt, x, y, z, w, h, size, color) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: makeLabel(txt, size, color), transparent: true, depthWrite: false, toneMapped: false, side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.renderOrder = 8; scene.add(m);
    }

    // ── U-SHAPED TIP using TubeGeometry ──
    function makeUTip() {
      // A half-circle arc (the U shape that caps the shaft)
      const R = 3.8;
      class UPath extends THREE.Curve {
        getPoint(t) {
          const a = Math.PI * t; // 0 → PI = half circle
          return new THREE.Vector3(Math.sin(a) * R, Math.cos(a) * R, 0);
        }
      }
      const geo = new THREE.TubeGeometry(new UPath(), 24, 1.2, 10, false);
      return geo;
    }

    // ── BUILD TOGGLE SWITCH ──
    // axis: 'z' = tilts left/right (rotation.z), 'x' = tilts fwd/back (rotation.x)
    function buildToggle(xPos, positions, axis, labelBelow, posLabels) {
      const SHAFT_R = 2.0, SHAFT_LEN = 20;
      const PIVOT_Z = PD / 2; // pivot at panel surface

      // Panel hole — flush, switch sits in it
      const hole = new THREE.Mesh(new THREE.CylinderGeometry(SHAFT_R + 2.5, SHAFT_R + 2.5, PD + 2, 20), matHole);
      hole.rotation.x = Math.PI / 2; hole.position.set(xPos, 0, 0); hole.renderOrder = 2; scene.add(hole);

      // O-ring / retaining nut — sits FLUSH with panel face, not raised
      // Thin flat disc at panel surface level
      const oRing = new THREE.Mesh(
        new THREE.RingGeometry(SHAFT_R + 1, SHAFT_R + 4.5, 24),
        new THREE.MeshStandardMaterial({ color: 0x404850, roughness: 0.45, metalness: 0.75 })
      );
      oRing.position.set(xPos, 0, PD / 2 + 0.2); // right at panel face
      oRing.renderOrder = 3;
      scene.add(oRing);
      // Thin collar ring (just slightly proud of panel, like a flush nut)
      const collarGeo = new THREE.CylinderGeometry(SHAFT_R + 4.5, SHAFT_R + 4.5, 1.5, 24);
      const collar = new THREE.Mesh(collarGeo, matBushing);
      collar.rotation.x = Math.PI / 2; collar.position.set(xPos, 0, PD / 2 + 0.5);
      scene.add(collar);

      // Pivot group
      const pivotGroup = new THREE.Group();
      pivotGroup.position.set(xPos, 0, PIVOT_Z);
      scene.add(pivotGroup);

      // Shaft — smooth cylinder
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(SHAFT_R, SHAFT_R, SHAFT_LEN, 18), matSwBody);
      shaft.rotation.x = Math.PI / 2; shaft.position.set(0, 0, SHAFT_LEN / 2);
      shaft.castShadow = true; pivotGroup.add(shaft);

      // Knurled grip rings near base
      [3, 5, 7, 9, 11].forEach(z => {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(SHAFT_R + 0.4, 0.45, 6, 18),
          new THREE.MeshStandardMaterial({ color: 0x6a7480, roughness: 0.4, metalness: 0.85 })
        );
        ring.position.set(0, 0, z); pivotGroup.add(ring);
      });

      // U-shaped tip at top of shaft
      const uGeo = makeUTip();
      const uTip = new THREE.Mesh(uGeo, matSwShiny);
      // U is in XY plane, opening facing -Y. Rotate so opening faces away from pivot.
      // We want the arc to cap the shaft end — rotate 90° around X so the U faces forward
      uTip.rotation.x = -Math.PI / 2;
      uTip.position.set(0, 0, SHAFT_LEN);
      uTip.castShadow = true;
      pivotGroup.add(uTip);

      // Position labels — close to switch
      const lz = PD / 2 + 1.5;
      posLabels.forEach(({ text, dx, dy }) => {
        addLabel(text, xPos + dx, dy, lz, 13, 5.5, 28, '#b8c8d4');
      });
      // Bottom label
      addLabel(labelBelow, xPos, -PH / 2 + 11, lz, 24, 6.5, 26, '#c8d4de');

      let cur = 0;
      const N = positions.length;
      let curAngle = positions[0];
      let targetAngle = positions[0];

      if (axis === 'z') pivotGroup.rotation.z = curAngle;
      else pivotGroup.rotation.x = curAngle;

      function setState(i) {
        cur = ((i % N) + N) % N;
        targetAngle = positions[cur];
      }

      return {
        pivotGroup,
        getState: () => cur,
        getN: () => N,
        cycleState: () => setState(cur + 1),
        update() {
          curAngle += (targetAngle - curAngle) * 0.13;
          if (Math.abs(targetAngle - curAngle) < 0.001) curAngle = targetAngle;
          if (axis === 'z') pivotGroup.rotation.z = curAngle;
          else pivotGroup.rotation.x = curAngle;
        }
      };
    }

    // ── SYS: 3-position LEFT / CENTER / RIGHT (rotation around Z axis) ──
    // Left = sys 1, Center = OFF, Right = sys 2
    const TILT = 0.52;
    const sysSwitch = buildToggle(-55,
      [TILT, 0, -TILT],  // left, center, right
      'z',
      'SYS',
      [
        { text: '1', dx: -14, dy: 8 },
        { text: 'OFF', dx: 0, dy: 18 },
        { text: '2', dx: 14, dy: 8 },
      ]
    );

    // ── PWS: 2-position LEFT / RIGHT (rotation around Z axis) ──
    const pwsSwitch = buildToggle(55,
      [TILT, -TILT],  // left=OFF, right=AUTO
      'z',
      'PWS',
      [
        { text: 'OFF', dx: -14, dy: 8 },
        { text: 'AUTO', dx: 14, dy: 8 },
      ]
    );

    const sysNames = ['1', 'OFF', '2'];
    const pwsNames = ['OFF', 'AUTO'];

    function updateUI() {
      document.getElementById('s-sys').textContent = `SYS: ${sysNames[sysSwitch.getState()]}`;
      document.getElementById('s-pws').textContent = `PWS: ${pwsNames[pwsSwitch.getState()]}`;
    }
    updateUI();

    // ── CLICK DETECTION ──
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const cv = document.getElementById('c');
    let downX = 0, downY = 0;
    cv.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
    cv.addEventListener('pointerup', e => {
      if (e.button !== 0) return;
      if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) return;
      const rect = cv.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / W) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / H) * 2 + 1;
      raycaster.setFromCamera(mouse, cam);
      if (raycaster.intersectObjects([sysSwitch.pivotGroup], true).length > 0) {
        sysSwitch.cycleState(); updateUI();
      } else if (raycaster.intersectObjects([pwsSwitch.pivotGroup], true).length > 0) {
        pwsSwitch.cycleState(); updateUI();
      }
    });

    // ── ORBIT ──
    let orbitDrag = false, px = 0, py = 0;
    const lookAt = new THREE.Vector3(0, 0, 0);
    const sph = new THREE.Spherical().setFromVector3(cam.position.clone().sub(lookAt));
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      if (e.button === 2 || e.shiftKey) { orbitDrag = true; px = e.clientX; py = e.clientY; cv.setPointerCapture(e.pointerId); }
    });
    window.addEventListener('pointerup', () => orbitDrag = false);
    window.addEventListener('mousemove', e => {
      if (!orbitDrag) return;
      sph.theta -= (e.clientX - px) * 0.009;
      sph.phi = Math.max(0.2, Math.min(1.8, sph.phi + (e.clientY - py) * 0.007));
      cam.position.copy(new THREE.Vector3().setFromSpherical(sph).add(lookAt));
      cam.lookAt(lookAt); px = e.clientX; py = e.clientY;
    });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      sph.radius = Math.max(80, Math.min(500, sph.radius + e.deltaY * 0.3));
      cam.position.copy(new THREE.Vector3().setFromSpherical(sph).add(lookAt));
      cam.lookAt(lookAt);
    }, { passive: false });

    function animate() {
      requestAnimationFrame(animate);
      sysSwitch.update(); pwsSwitch.update();
      renderer.render(scene, cam);
    }
    animate();
  </script>
</body>

</html>
